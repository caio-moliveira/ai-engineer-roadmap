name: bloco-6-decision-models

on:
  push:
    paths: ["06-decision-models/**", "pyproject.toml", "uv.lock", ".github/workflows/decision-models.yml"]
  pull_request:
    paths: ["06-decision-models/**", "pyproject.toml", "uv.lock", ".github/workflows/decision-models.yml"]

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DECISION_PROVIDER: replay # RF-03: nada de chave, nada de rede
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: uv sync --frozen
      - name: Testes do common/ e smoke test de cada módulo em replay
        working-directory: 06-decision-models
        run: uv run pytest tests -q

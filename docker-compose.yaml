# NVIDIA CUDA deployment

services:
  docling-serve:
    image: ghcr.io/docling-project/docling-serve-cu126:main
    container_name: docling-serve
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
      NVIDIA_VISIBLE_DEVICES: "all" # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/docker-specialized.html
    # deploy:  # This section is for compatibility with Swarm
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    runtime: nvidia
    restart: always

  # Bloco 6: Laya, modelo de decisão open-weight, no mesmo protocolo do Jev.
  # Perfil próprio para não subir junto com o docling: docker compose --profile decision up laya
  laya:
    profiles: ["decision"]
    build: ./06-decision-models/laya
    container_name: laya
    ports:
      - "8001:8001"
    environment:
      LAYA_THREADS: "4" # mantenha <= núcleos físicos
    volumes:
      - laya-cache:/cache/huggingface # o checkpoint (~1,3 GB) baixa uma vez só
    restart: unless-stopped

volumes:
  laya-cache:

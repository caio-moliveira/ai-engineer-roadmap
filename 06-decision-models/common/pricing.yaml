# Preços em US$ por 1M tokens. Nunca escreva preço no código: o custo de toda decisão
# sai desta tabela (RF-07). Mudou um preço, mudou a conclusão da comparação:
# commit explícito e revisão humana.
#
# Fonte e data de cada linha estão no campo `source`. Preços de API mudam;
# confira antes de apresentar números e atualize `reference_date`.
#
# Modelo ausente ou com preço null -> PricingMissingError (nunca custo zero silencioso).

reference_date: "2026-10-03"

models:
  # Jev cobra só entrada; a saída de um modelo de decisão é a distribuição, não tokens.
  jev-1.13.0:
    input: 0.042
    output: 0
    source: "TypeSafe, tabela copiada do workshop-jev em 03/10/2026"
  # Laya roda na sua máquina: o custo é hardware e energia, não token.
  # Para comparar com API, calcule custo/hora da máquina ÷ decisões/hora no seu ambiente.
  laya-rl-agent:
    input: 0
    output: 0
    source: "Apache 2.0, self-hosted; custo de hardware fora da tabela"
  gpt-5.6-luna:
    input: 0.20
